name: Release

# Bump the version in package.json on main, run this from the Actions tab, it will make the release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm ci

      - name: Resolve tag from package.json
        id: v
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing tag
        run: |
          tag='${{ steps.v.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists - bump the version in package.json"
            exit 1
          fi

      - run: pnpm typecheck

      - run: pnpm build

      # dist is gitignored, so force-add it onto a commit that lives only on the tag.
      - name: Tag a commit containing dist
        run: |
          tag='${{ steps.v.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist
          git commit -m "build: $tag"
          git tag "$tag"
          git push origin "$tag"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create '${{ steps.v.outputs.tag }}' ./*.tgz --generate-notes
